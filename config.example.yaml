# pmwallets-copytrade — configuration.
# Every key is optional except pmwallets.apiKey (and, in live mode, the polymarket keys).
# ${NAME} is replaced by the environment variable NAME — keep secrets out of this file.
# Full reference: see "Configuration" in the README.

# dry-run: every decision is logged, nothing is traded (fills are simulated at the best price on the book).
# live:    real orders with real money. Switch only after the dry-run log looks right.
mode: dry-run

pmwallets:
  apiKey: ${PMW_API_KEY}                 # from https://pmwallets.com/keys
  # baseUrl: https://api.pmwallets.com

polymarket:                              # read in live mode and by `pmwallets-copytrade check`
  # Recommended: a separate account just for the bot — a new MetaMask account, signed up on polymarket.com
  # by connecting it (see "Set up a Polymarket account for the bot" in the README). That is type 3.
  #
  # signatureType has no default; the bot will not trade until it is set:
  #   3 = Deposit Wallet: any account created on polymarket.com on or after 2026-05-04
  #   2 = Safe Wallet:   created before 2026-05-04 by connecting MetaMask / Rabby / another browser wallet
  #   1 = Proxy Wallet:  created before 2026-05-04 with email or Google (Magic)
  #   0 = plain wallet:  your own address holds the funds (you must approve the exchange contracts yourself)
  # privateKey:    the wallet you sign in with (type 1: the Magic key exported from polymarket.com)
  # funderAddress: the account wallet shown in the polymarket.com profile menu (type 0: may be omitted)
  # signatureType: 3
  # privateKey: ${POLY_PRIVATE_KEY}
  # funderAddress: ${POLY_FUNDER_ADDRESS}
  # Polymarket API credentials — optional: derived from privateKey at start-up when absent.
  # apiKey: ${POLY_API_KEY}
  # apiSecret: ${POLY_API_SECRET}
  # apiPassphrase: ${POLY_API_PASSPHRASE}
  # clobUrl: https://clob.polymarket.com

# Who to copy. Empty = every entity your PMWallets account subscribes to (subscribe on pmwallets.com or via the SDK).
targets: []
#  - entity: "0x9d84ce0306f8551e02efef1680475fc0f1dc1344"   # the address you see once subscribed
#    orderSizeUsdc: 20                                     # per-target override of copy.orderSizeUsdc
#    maxBuysPerOutcome: 1                                  # per-target override of copy.maxBuysPerOutcome
#  - entity: "7KQ2MF9X4B1C"                                # a board handle works once you own the address

copy:
  orderSizeUsdc: 10          # USDC spent on each copied BUY
  roles: [taker, maker]      # copy the target's taker fills, maker fills, or both
  maxBuysPerOutcome: 3       # copy up to 3 BUYs into the same outcome (averaging in), then only hold
  maxOpenPositions: 20       # outcomes held at once, all targets together
  maxOpenPositionsPerTarget: 5
  maxFillAgeSec: 60          # a target BUY older than this when it reaches the bot is not copied
  minTargetNotionalUsdc: 25  # ignore target BUYs smaller than this (bots trade $1–2 fills)
  minPrice: 0.05             # only BUY when the best ask is inside [minPrice, maxPrice]
  maxPrice: 0.95
  maxSlippage: 0.03          # skip if the best ask is more than this above what the target paid
  minBookDepthUsdc: 50       # skip if the side we take holds less than this much USDC
  minSecondsToEndDate: 600   # don't BUY a market that settles within 10 minutes
  maxSecondsToEndDate: 0     # don't BUY a market that settles later than this; 0 = no limit
  sellMode: all              # all = exit when the target sells; none = hold to settlement

risk:
  maxDailySpendUsdc: 200     # total USDC of copied BUYs per UTC day, unconfirmed orders included; 0 = no limit

dataDir: ./pmw-data          # state, stream cursor, lock file and the decisions log
